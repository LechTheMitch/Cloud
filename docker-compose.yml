
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: game_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MYSQL_SERVER=db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DB=game_db
    depends_on:
      - db

volumes:
  db_data:
